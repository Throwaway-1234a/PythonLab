[project]
name = "findex"
version = "1.0.0"
description = "Full-text search engine built from scratch"
readme = "README.md"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "fastembed>=0.3.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "numpy>=1.26.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "uvicorn[standard]>=0.28.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "matplotlib>=3.11.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
